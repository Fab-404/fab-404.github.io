<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBO GLOBAL - Tableau de Bord Production</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0f172a', /* slate-900 */
                        secondary: '#334155', /* slate-700 */
                        accent: '#3b82f6', /* blue-500 */
                    }
                }
            }
        }
    </script>

    <!-- Icons & Charts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased h-screen flex overflow-hidden">

    <!-- Sidebar: Modern Dark Theme -->
    <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl z-20 transition-all duration-300 transform"
        id="sidebar">
        <!-- Logo Area -->
        <div class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950">
            <div class="flex items-center gap-3">
                <div
                    class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 text-white"></i>
                </div>
                <span class="text-lg font-bold tracking-tight">TBO GLOBAL</span>
            </div>
        </div>

        <!-- Navigation Scroll Area -->
        <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1 custom-scrollbar" id="sidebar-nav">
            <!-- Injecté par JS -->
        </nav>

        <!-- User Profile (Bottom) -->
        <div class="p-4 border-t border-slate-800 bg-slate-900">
            <button class="flex items-center gap-3 w-full p-2 rounded-lg hover:bg-slate-800 transition-colors">
                <div
                    class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-sm font-bold border-2 border-slate-700">
                    AD
                </div>
                <div class="text-left">
                    <p class="text-sm font-medium text-white">Admin User</p>
                    <p class="text-xs text-slate-400">Production Manager</p>
                </div>
                <i data-lucide="chevron-up" class="w-4 h-4 text-slate-500 ml-auto"></i>
            </button>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden">

        <!-- Header -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-10 shadow-sm">
            <div class="flex items-center gap-4">
                <button id="sidebar-toggle" class="p-2 rounded-md hover:bg-slate-100 lg:hidden">
                    <i data-lucide="menu" class="w-5 h-5 text-slate-600"></i>
                </button>
                <div class="flex flex-col">
                    <h1 id="page-title" class="text-xl font-bold text-slate-800 tracking-tight">Dashboard</h1>
                    <p id="page-subtitle" class="text-xs text-slate-500 hidden sm:block">Vue d'ensemble de la production
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div
                    class="hidden md:flex items-center px-3 py-1.5 bg-slate-100 rounded-full border border-transparent focus-within:border-blue-300 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-2"></i>
                    <input type="text" placeholder="Rechercher..."
                        class="bg-transparent border-none outline-none text-sm text-slate-600 w-48 placeholder-slate-400">
                </div>

                <div class="h-6 w-px bg-slate-200 mx-1"></div>

                <div
                    class="flex items-center gap-2 text-sm text-slate-500 font-medium bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                    <i data-lucide="calendar" class="w-4 h-4 text-blue-500"></i>
                    <span id="current-date">--/--/----</span>
                </div>

                <button class="p-2 rounded-full hover:bg-slate-100 relative group">
                    <i data-lucide="bell"
                        class="w-5 h-5 text-slate-500 group-hover:text-blue-600 transition-colors"></i>
                    <span
                        class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                </button>
            </div>
        </header>

        <!-- Scrollable Content -->
        <main class="flex-1 overflow-auto bg-slate-50 p-8 scroll-smooth" id="main-content">
            <!-- Squelette de chargement initial -->
            <div id="loading-state" class="flex flex-col items-center justify-center h-full space-y-4 animate-pulse">
                <div class="w-12 h-12 bg-slate-200 rounded-full"></div>
                <div class="space-y-2 text-center">
                    <div class="h-4 w-48 bg-slate-200 rounded mx-auto"></div>
                    <div class="h-3 w-32 bg-slate-200 rounded mx-auto"></div>
                </div>
                <p class="text-slate-400 text-sm font-medium">Chargement des données Excel...</p>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/demo-data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
